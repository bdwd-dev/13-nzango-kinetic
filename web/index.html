<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NZANGO KINETIC — E-Sport</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #222; }
    .logo { font-size: 28px; font-weight: 900; color: #FF4081; letter-spacing: 2px; }
    .nav { display: flex; gap: 24px; }
    .nav a { color: #888; text-decoration: none; font-size: 14px; }
    .nav a:hover, .nav a.active { color: #FF4081; }
    .hero { padding: 40px 0; }
    .hero h1 { font-size: 32px; margin-bottom: 8px; }
    .hero p { color: #666; font-size: 16px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 24px 0; }
    .stat-card { background: #141414; border-radius: 12px; padding: 20px; border: 1px solid #222; }
    .stat-value { font-size: 32px; font-weight: bold; color: #FF4081; }
    .stat-label { font-size: 12px; color: #666; margin-top: 4px; text-transform: uppercase; }
    .section { margin: 32px 0; }
    .section-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #141414; border-radius: 12px; padding: 20px; border: 1px solid #222; }
    .card:hover { border-color: #FF4081; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-sub { color: #666; font-size: 13px; }
    .btn { background: #FF4081; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .btn:hover { opacity: 0.9; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-open { background: #1a3a1a; color: #4ade80; }
    .badge-ongoing { background: #1a2a3a; color: #38bdf8; }
    .table { width: 100%; border-collapse: collapse; }
    .table th { text-align: left; padding: 12px; color: #666; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #222; }
    .table td { padding: 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
    .table tr:hover { background: #1a1a1a; }
    .footer { text-align: center; padding: 40px 0; color: #444; font-size: 13px; border-top: 1px solid #222; margin-top: 40px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = "http://localhost:3013/api";

    function App() {
      const [stats, setStats] = useState({});
      const [players, setPlayers] = useState([]);
      const [tournaments, setTournaments] = useState([]);
      const [matches, setMatches] = useState([]);

      useEffect(() => {
        fetch(`${API}/stats`).then(r => r.json()).then(setStats);
        fetch(`${API}/players`).then(r => r.json()).then(setPlayers);
        fetch(`${API}/tournaments`).then(r => r.json()).then(setTournaments);
        fetch(`${API}/matches`).then(r => r.json()).then(setMatches);
      }, []);

      return (
        <div>
          <header className="header">
            <div className="logo">⚡ NZANGO KINETIC</div>
            <nav className="nav">
              <a href="#" className="active">Lobby</a>
              <a href="#">Tournois</a>
              <a href="#">Classement</a>
              <a href="#">Mobile Money</a>
            </nav>
          </header>

          <div className="container">
            <section className="hero">
              <h1>Le Choc des Reines</h1>
              <p>E-sport • Duel de sauts • Stratégie • Culture africaine</p>
            </section>

            <div className="stats">
              <div className="stat-card">
                <div className="stat-value">{stats.players || 0}</div>
                <div className="stat-label">Joueuses</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.tournaments || 0}</div>
                <div className="stat-label">Tournois</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.matches || 0}</div>
                <div className="stat-label">Matchs</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.transactions || 0}</div>
                <div className="stat-label">Paiements</div>
              </div>
            </div>

            <section className="section">
              <h2 className="section-title">🏆 Tournois</h2>
              <div className="grid">
                {tournaments.map(t => (
                  <div key={t.id} className="card">
                    <div style={{display:'flex', justifyContent:'space-between'}}>
                      <div className="card-title">{t.name}</div>
                      <span className={`badge badge-${t.status}`}>{t.status}</span>
                    </div>
                    <div className="card-sub">💰 {t.prize} • 🎫 {t.entry_fee} XAF</div>
                    <div className="card-sub">👥 {t.participants.length}/{t.max_players} joueuses</div>
                    <button className="btn btn-sm" style={{marginTop:8}}>S'inscrire (MoMo)</button>
                  </div>
                ))}
              </div>
            </section>

            <section className="section">
              <h2 className="section-title">👸 Classement</h2>
              <table className="table">
                <thead><tr><th>Avatar</th><th>Joueuse</th><th>Points</th><th>W/L</th><th>Niveau</th></tr></thead>
                <tbody>
                  {players.map(p => (
                    <tr key={p.id}>
                      <td>{p.avatar}</td>
                      <td>{p.name}</td>
                      <td>{p.points}</td>
                      <td>{p.wins}/{p.losses}</td>
                      <td><span className="badge badge-open">{p.level}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </section>
          </div>

          <footer className="footer">
            <p>© 2026 NZANGO KINETIC • Unity • Mobile Money • Culture Africaine</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
